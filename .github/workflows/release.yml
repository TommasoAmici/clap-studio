name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize publication across main and manually selected refs.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to create the tag and the GitHub release

env:
  # The app build does not use website screenshots or animations.
  GIT_LFS_SKIP_SMUDGE: '1'
  # BirdNET (bird species) is CC BY-NC-SA 4.0, and for now every release includes it. To sell the app, change this
  # to '0': the build then leaves out the feature and its models.
  NON_COMMERCIAL: '1'

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check release version
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/test-release-version.py
          python3 scripts/check-release-version.py --github-output "$GITHUB_OUTPUT"

  release:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-laion-clap-htsat-unfused-v1

      - name: Export CLAP model
        # Writes CLAPAudio/CLAPText.mlpackage and the tokenizer files to
        # ~/Library/Application Support/ClapStudio/Models, where bundle.sh picks them up.
        run: |
          pip install -r tools/requirements.txt
          python3 tools/export_clap.py

      - name: Set up uv
        if: env.NON_COMMERCIAL != '0'
        uses: astral-sh/setup-uv@v5

      - name: Cache BirdNET download
        if: env.NON_COMMERCIAL != '0'
        uses: actions/cache@v4
        with:
          path: tools/.cache/birdnet
          key: birdnet-v2.4-download-v1

      - name: Export BirdNET model
        if: env.NON_COMMERCIAL != '0'
        # Converts BirdNET V2.4 (and its location model) to Core ML next to the CLAP model. The script checks the
        # Core ML output against the original and fails if they differ. uv installs its own dependencies.
        run: uv run --python 3.12 tools/export_birdnet.py

      - name: Build app bundle
        run: scripts/bundle.sh

      - name: Verify models are bundled
        run: |
          RES="build/ClapStudio.app/Contents/Resources"
          for item in CLAPAudio.mlpackage CLAPText.mlpackage clap_vocab.json clap_merges.txt; do
            test -e "$RES/$item" || { echo "Missing $item in app bundle"; exit 1; }
          done
          if [ "$NON_COMMERCIAL" = "0" ]; then
            ls "$RES"/BirdNET* >/dev/null 2>&1 && { echo "BirdNET must not be in a commercial build"; exit 1; }
          else
            for item in BirdNET.mlpackage BirdNETLocation.mlpackage birdnet_labels.txt BirdNET-LICENSE.txt; do
              test -e "$RES/$item" || { echo "Missing $item in app bundle"; exit 1; }
            done
          fi
          du -sh "$RES"/*.mlpackage

      - name: Stamp version and re-sign
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APP="build/ClapStudio.app"
          PLIST="$APP/Contents/Info.plist"
          BASE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          # Editing Info.plist invalidates the ad-hoc signature from bundle.sh.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "tag=v${BASE_VERSION}-build.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "asset=ClapStudio-${BASE_VERSION}-build.${BUILD_NUMBER}-macos.zip" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package app
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          # ditto keeps the bundle's symlinks, permissions and signature intact (plain zip does not).
          ditto -c -k --sequesterRsrc --keepParent build/ClapStudio.app "$ASSET"
          shasum -a 256 "$ASSET" | tee "$ASSET.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUBLISH=$(python3 scripts/check-release-version.py --version "$VERSION")
          if [ "$PUBLISH" != "true" ]; then
            echo "Skipped publication: app version $VERSION has not increased." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/release-notes.py "$VERSION" > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Installing this build

          The app is ad-hoc signed, not notarized. After unzipping, right-click the app and choose Open the first time, or run `xattr -dr com.apple.quarantine ClapStudio.app`. This build bundles the LAION-CLAP model (Apache-2.0).
          NOTES
          if [ "$NON_COMMERCIAL" != "0" ]; then
            printf '\nIt also bundles BirdNET V2.4 (CC BY-NC-SA 4.0): non-commercial use only.\n' >> release-notes.md
          fi
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "Clap Studio $TAG" \
            --notes-file release-notes.md
